adapter_name: "core_banking_production"
source_type: "database"

database:
  connection_string: "postgresql://username:password@your-db-host.com:5432/core_banking"

  query: >
    SELECT 
      cust_id,
      age_years AS "tuoi",
      yearly_income AS "thu_nhap",
      credit_score_val AS "diem_tin_dung",
      ownership_type AS "nha_o",
      loan_purpose AS "muc_dich_vay",
      debt_ratio AS "ti_le_no"
    FROM loan_contracts
    WHERE created_at >= :window_start AND created_at < :window_end;
  
  watermark_column: "created_at"
