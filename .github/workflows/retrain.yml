name: Model Retraining & Closed-Loop Promotion

on:
  repository_dispatch:
    types: [retrain_trigger]
  workflow_dispatch:
    inputs:
      force:
        description: "Force promotion bypassing evaluation gate"
        type: boolean
        default: false

jobs:
  retrain-and-promote:
    name: Train Challenger, Evaluate & Promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r retrain/requirements.txt
          pip install psycopg2-binary

      - name: Authenticate to Google Cloud via WIF
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Step 1 - Train Challenger Model
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          python -m retrain.train --data-source recent_logs

      - name: Step 2 - Offline Champion vs Challenger Evaluation
        run: |
          python -m retrain.evaluate

      - name: Step 3 - Promote Challenger & Refresh Baseline
        env:
          SERVING_RELOAD_URL: ${{ secrets.SERVING_RELOAD_URL }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          python -m retrain.promote $FORCE_FLAG

      - name: Step 3.5 - Log Retrain Audit to Neon Database
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_APPLIED: ${{ github.event.inputs.force }}
        run: |
          python -m retrain.audit_logger

      - name: Step 4 - Commit Version Updates (if applicable)
        run: |
          git config --global user.name "DriftOps Bot"
          git config --global user.email "bot@driftplatform.ai"
          git add data/models/latest.json || true
          git commit -m "chore(model): promote new champion version [skip ci]" || true
          git push || true

      - name: Step 5 - Send Post-Retrain Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials missing in GitHub Secrets. Skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            ICON="🎉"
            TITLE="MODEL RETRAINING & PROMOTION COMPLETED"
            STATUS_DESC="✅ Champion promoted successfully & Baseline refreshed."
          else
            ICON="❌"
            TITLE="MODEL RETRAINING FAILED"
            STATUS_DESC="⚠️ Pipeline failed during training, evaluation, or promotion."
          fi

          WORKFLOW_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          DASHBOARD_URL="https://data-drift-platform.vercel.app/dashboard"

          MESSAGE="${ICON} <b>${TITLE}</b>"$'\n'
          MESSAGE+="━━━━━━━━━━━━━━━━━━━━"$'\n'
          MESSAGE+="<b>Triggered Event:</b> <code>${{ github.event_name }}</code>"$'\n'
          MESSAGE+="<b>Result:</b> ${STATUS_DESC}"$'\n'
          MESSAGE+="<b>GitHub Run ID:</b> #${RUN_ID}"$'\n'
          MESSAGE+="━━━━━━━━━━━━━━━━━━━━"$'\n'
          MESSAGE+="<i>Closed-loop MLOps automation pipeline</i>"

          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            --arg wf_url "$WORKFLOW_URL" \
            --arg db_url "$DASHBOARD_URL" \
            '{
              chat_id: $chat_id,
              text: $text,
              parse_mode: "HTML",
              reply_markup: {
                inline_keyboard: [
                  [
                    { text: "📜 View GitHub Logs", url: $wf_url },
                    { text: "📊 Open Dashboard", url: $db_url }
                  ]
                ]
              }
            }')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
            
