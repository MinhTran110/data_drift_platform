name: Model Retraining & Closed-Loop Promotion

on:
  repository_dispatch:
    types: [retrain_trigger]
  workflow_dispatch:
    inputs:
      force:
        description: "Force promotion bypassing evaluation gate"
        type: boolean
        default: false

jobs:
  retrain-and-promote:
    name: Train Challenger, Evaluate & Promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r retrain/requirements.txt
          pip install psycopg2-binary

      - name: Authenticate to Google Cloud via WIF
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Step 1 - Train Challenger Model
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          python -m retrain.train --data-source recent_logs

      - name: Step 2 - Offline Champion vs Challenger Evaluation
        run: |
          python -m retrain.evaluate

      - name: Step 3 - Promote Challenger & Refresh Baseline
        env:
          SERVING_RELOAD_URL: ${{ secrets.SERVING_RELOAD_URL }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          python -m retrain.promote $FORCE_FLAG

      - name: Step 3.5 - Log Retrain Audit to Neon Database
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_APPLIED: ${{ github.event.inputs.force }}
        run: |
          python -c "
          import os, json, psycopg2

          db_url = os.getenv('DATABASE_URL')
          if not db_url:
              print('[WARN] DATABASE_URL secret not set. Skipping audit logging.')
              exit(0)

          try:
              with open('data/models/latest.json') as f:
                  m = json.load(f)
          except Exception as e:
              print(f'[WARN] Could not read latest.json: {e}')
              m = {}

          metrics = m.get('metrics', {})
          verdict = m.get('evaluation_verdict', 'UNKNOWN')
          status = 'COMPLETED' if verdict == 'APPROVED' else 'REJECTED'
          
          approver = 'System (Closed-Loop)'
          if os.getenv('FORCE_APPLIED') == 'true':
              approver = 'Manual Override (Force)'

          try:
              conn = psycopg2.connect(db_url)
              cur = conn.cursor()
              cur.execute("""
                  INSERT INTO retrain_jobs (
                      run_id, triggered_by, status, champion_version,
                      challenger_version, metrics, approved_by, created_at, updated_at
                  )
                  VALUES (NULL, %s, %s, %s, %s, %s, %s, NOW(), NOW());
              """, (
                  os.getenv('EVENT_NAME', 'workflow_dispatch'),
                  status,
                  m.get('previous_version', 'v1'),
                  m.get('version', 'v2'),
                  json.dumps(metrics),
                  approver
              ))
              conn.commit()
              cur.close()
              conn.close()
              print('[SUCCESS] Audit record inserted into Neon DB successfully!')
          except Exception as db_err:
              print(f'[ERROR] Failed to insert audit log into database: {db_err}')
          "

      - name: Step 4 - Commit Version Updates (if applicable)
        run: |
          git config --global user.name "DriftOps Bot"
          git config --global user.email "bot@driftplatform.ai"
          git add data/models/latest.json || true
          git commit -m "chore(model): promote new champion version [skip ci]" || true
          git push || true
