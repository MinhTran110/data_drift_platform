name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pandas numpy scipy scikit-learn pyyaml requests

      - name: Lint with Flake8
        run: |
          flake8 worker retrain serving tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 worker retrain serving tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Pytest
        run: |
          python -m pytest -v tests/

  web-build:
    name: Next.js Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install NPM Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Application
        run: |
          cd web
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
