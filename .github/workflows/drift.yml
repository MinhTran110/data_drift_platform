name: Batch Drift Monitoring Worker

on:
  schedule:
    # Near-real-time batch monitoring: runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Monitoring window in hours"
        required: false
        default: "6"

jobs:
  monitor-drift:
    name: Quantify Data Drift & Ingest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Authenticate to Google Cloud via WIF
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run Drift Quantification Worker
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          WEB_API_URL: ${{ secrets.WEB_API_URL }}
          DRIFT_HMAC_SECRET: ${{ secrets.DRIFT_HMAC_SECRET }}
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || '6' }}
        run: |
          python -m worker.run --window-hours "$WINDOW_HOURS"
